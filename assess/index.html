  var hasTop=top.length>0,dy=hasTop?0:-70;
  top.forEach(function(o){B+=box(o.x,Y1,o.w,H,o.t,o.s,"main",o.k);L+='<line x1="'+o.c+'" y1="'+(Y1+H)+'" x2="'+o.c+'" y2="'+(BUS+dy)+'"/>';xs.push(o.c)});
  row2.forEach(function(o){B+=box(o.x,Y2+dy,110,H,o.t,o.s,"main",o.k);L+='<line x1="'+o.c+'" y1="'+(Y2+dy+H)+'" x2="'+o.c+'" y2="'+(BUS+dy)+'"/>';xs.push(o.c)});
  var n=A.counters,slots=n<=4?Array.apply(null,{length:n}).map(function(_,k){return "櫃台 "+(k+1)}):["櫃台 1","櫃台 2","…","櫃台 "+n];
  var w=80,g=10,tot=slots.length*w+(slots.length-1)*g,sx=(380-tot)/2,dk=has("disp").keep&&has("key").keep;
  slots.forEach(function(t,k){var x=sx+k*(w+g),c=x+w/2;
    if(t==="…"){B+='<text x="'+c+'" y="'+(Y3+dy+H/2)+'" text-anchor="middle" dominant-baseline="central" font-size="20" fill="#5d6b80">⋯</text>';return}
    B+=box(x,Y3+dy,w,H,t,"顯示＋鍵盤","c",dk);L+='<line x1="'+c+'" y1="'+(BUS+dy)+'" x2="'+c+'" y2="'+(Y3+dy)+'"/>';xs.push(c)});
  var mn=Math.min.apply(null,xs),mx=Math.max.apply(null,xs);
  L+='<line x1="'+mn+'" y1="'+(BUS+dy)+'" x2="'+mx+'" y2="'+(BUS+dy)+'"/>';
  var h=Y3+dy+H+12;
  return '<svg viewBox="0 0 380 '+h+'" width="100%" role="img" aria-label="建議配置架構圖"><g stroke="#7f93b0" stroke-width="1.2">'+L+'</g>'+B+'</svg>';
}

var ICON={kiosk:'<rect x="6" y="2" width="12" height="15" rx="2"/><path d="M9 21h6M12 17v4M9 7h6M9 11h6"/>',soft:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M7 9l2 2-2 2M12 13h4"/>',voice:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 8a5 5 0 0 1 0 8"/>',amp:'<rect x="6" y="3" width="12" height="18" rx="2"/><circle cx="12" cy="14" r="3"/><circle cx="12" cy="7" r="1"/>',disp:'<rect x="3" y="7" width="18" height="10" rx="2"/><path d="M8 12h.01M12 12h.01M16 12h.01"/>',key:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/>',board:'<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M6 9h5M6 12h5M15 9h3M15 12h3"/>',adscreen:'<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M10 8l5 2.5-5 2.5z"/>',media:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M10 9l5 3-5 3z"/>',mediasoft:'<path d="M4 6h16M4 12h10M4 18h7"/><path d="M16 15l5 3-5 3z"/>',report:'<path d="M4 20V10M10 20V4M16 20v-8M3 20h18"/>'};
var PHOTO={kiosk:"p_kiosk.webp",aio:"p_aio.webp",voice:"speaker.jpg",disp:"p_counter.webp",key:"p_keypad.webp",lcd:"p_lcd.webp",led:"p_led.webp",adscreen:"p_signage.webp",report:"report.jpg"};
var CASES={
 gov:[["case_lobby","地政事務所服務大廳：每個櫃台上方有號碼顯示"],["case_window","單一窗口：櫃台燈箱搭配叫號顯示"]],
 med:[["lcdcase","液晶叫號資訊看板：叫號與衛教宣導同一畫面"],["case_vertical","直立式螢幕：上方播影片、下方顯示叫號"]],
 fin:[["case_vertical","直立式螢幕：上方播影片、下方顯示叫號"],["lcdcase","液晶叫號資訊看板"]],
 pub:[["lcdcase","液晶叫號資訊看板：叫號與宣導同一畫面"],["case_lobby","服務大廳：櫃台上方號碼顯示"]],
 shop:[["lcdcase","液晶叫號資訊看板"],["case_vertical","直立式螢幕：播廣告兼顯示叫號"]],
 other:[["case_lobby","服務大廳：櫃台上方號碼顯示"],["lcdcase","液晶叫號資訊看板"]]
};
function photos(items){
  var has=function(k){return items.filter(function(x){return x.key===k})[0]},t=[];
  var k=has("kiosk");
  if(k&&A.ticket!=="none")t.push([A.ticket==="kiosk"?"kiosk":"aio",A.ticket==="kiosk"?"直立式取號機":"桌上型取號機",1,k.keep]);
  var v=has("voice");if(v)t.push(["voice","語音叫號喇叭",1,v.keep]);
  var b=has("board");if(b)t.push([A.board==="led"?"led":"lcd",A.board==="led"?"LED 叫號總表":"液晶叫號總表",1,b.keep]);
  var a=has("adscreen");if(a)t.push(["adscreen","宣導播放螢幕",1,false]);
  var d=has("disp");t.push(["disp","櫃台顯示器",d.qty,d.keep]);
  var kk=has("key");t.push(["key","櫃台叫號鍵盤",kk.qty,kk.keep]);
  var r=has("report");if(r)t.push(["report","主管報表",1,false]);
  return t.map(function(x){return '<div class="pt'+(x[3]?' kp':'')+'"><span class="qn">'+(x[3]?'沿用':'×'+x[2])+'</span><div class="im"><img src="img/'+PHOTO[x[0]]+'" alt="'+x[1]+'" loading="lazy"></div><div class="lb">'+x[1]+'</div></div>'}).join("");
}
function icon(k){return '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICON[k]||ICON.soft)+'</svg>'}

function summary(){
  var c=A.contact,lab=function(qid){var q=Q.filter(function(x){return x.id===qid})[0];var o=q.o.filter(function(x){return x[0]===A[qid]})[0];return o?o[1]:""};
  return '<p class="sum">'+esc(c.org)+'｜'+A.counters+' 個櫃台｜'+A.lanes+' 種業務｜'+esc(lab("ticket"))+'</p>';
}
function renderResult(){
  var items=config();
  var h='<h1>您的建議配置</h1>'+summary()+'<div class="dia">'+diagram(items)+'</div><p class="cap">示意圖，實際配置依現場評估'+(A.legacy==="keep"?'；虛線框＝沿用現有設備':'')+'</p>';
  h+='<h3>設備實景</h3><div class="ph">'+photos(items)+'</div>';
  h+='<h3>設備清單</h3>';
  items.forEach(function(x){h+='<div class="it"><div class="ic">'+icon(x.key)+'</div><div><div class="nm">'+esc(x.name)+(x.keep?'<span class="tag">沿用現有</span>':'')+'</div><div class="ds">'+esc(x.desc)+'</div></div><div class="q">×'+x.qty+'</div></div>'});
  h+='<h3>服務項目</h3><div class="svc">含施工及安裝、線材及配線、系統設定及連線測試、操作教學。</div>';
  if(A.board==="unsure")h+='<p class="sum" style="margin-top:12px">叫號總表先以液晶螢幕規劃，評估時會一併建議 LED 或液晶。</p>';
  var cs=CASES[A.org]||CASES.other;
  h+='<h3>相似案例</h3><div class="cs">'+cs.map(function(c){return '<img src="img/'+c[0]+'.jpg" alt="'+c[1]+'" loading="lazy"><p class="cap" style="text-align:left;margin:-2px 0 12px">'+c[1]+'</p>'}).join("")+'</div>';
  h+='<div class="next"><p><b>下一步</b></p><p>正茂將於 1–2 個工作天內與您聯繫報價。</p><p>可以先把現場照片（櫃台、等候區、想掛總表的牆面）傳到 LINE：<a href="https://line.me/R/ti/p/~'+CONTACT.line+'">'+CONTACT.line+'</a>，評估會更準。</p><p>電話 <a href="'+CONTACT.telHref+'">'+CONTACT.tel+'</a>｜手機 '+CONTACT.mobile+'</p></div>';
  h+='<div class="nav"><button type="button" class="btn ghost" style="flex:1" id="again">重新填寫</button></div>';
  app.innerHTML=h;
  document.getElementById("again").onclick=function(){A={counters:3,lanes:1,lang:[],keepItems:[]};i=0;render();window.scrollTo(0,0)};
}

function answersText(){
  var lines=[];Q.forEach(function(q){var v=A[q.id];if(q.type==="one"){var o=q.o.filter(function(x){return x[0]===v})[0];v=o?o[1]:""}lines.push(q.t+"："+v);if(q.sub&&A[q.id]===q.sub.when)lines.push("　"+q.sub.t+"："+(A[q.sub.id]||[]).join("、"))});
  lines.push("建議配置：");config().forEach(function(x){lines.push("　"+x.name+" ×"+x.qty+(x.keep?"（沿用）":""))});
  return lines.join("\n");
}
function submit(){
  var lab=function(qid){var q=Q.filter(function(x){return x.id===qid})[0],o=q.o.filter(function(x){return x[0]===A[qid]})[0];return o?o[1]:""};
  var payload={org:A.contact.org,name:A.contact.name,tel:A.contact.tel,line:A.contact.line,note:A.contact.note,orgType:lab("org"),counters:A.counters,lanes:A.lanes,ticket:lab("ticket"),voice:A.voice==="yes"?A.lang.join("、"):"不需要",board:lab("board"),ads:lab("ads"),report:lab("report"),legacy:lab("legacy")+(A.legacy==="keep"&&A.keepItems.length?"："+A.keepItems.join("、"):""),summary:answersText()};
  if(!FORM.action){console.log("FORM 尚未設定，未送出：",payload);return}
  var fd=new FormData();Object.keys(FORM.fields).forEach(function(k){if(payload[k]!=null)fd.append(FORM.fields[k],payload[k])});
  fetch(FORM.action,{method:"POST",mode:"no-cors",body:fd}).catch(function(){});
}
render();
</script>
